name: Promote to production

# Started by hand (Actions → Promote to production → Run workflow) after the internal build
# has been checked. Moves the current internal release to production and uploads the store
# listing (texts, icon, feature graphic and screenshots) from fastlane/metadata/android.
on:
  workflow_dispatch:
    inputs:
      listing:
        description: Also upload the store listing (texts and images)
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Promote internal to production
        run: fastlane android production

      - name: Upload the store listing
        if: inputs.listing
        run: fastlane android listing
