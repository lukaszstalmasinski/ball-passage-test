name: "Play: promote to production"

# Started by hand (Actions → "Play: promote to production" → Run workflow) after the build has been
# tested. Moves the alpha release (or the internal one, if alpha is skipped) to production and
# uploads the store listing (texts, icon, feature graphic and screenshots) from
# fastlane/metadata/android.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Track to promote from
        type: choice
        options: [alpha, internal]
        default: alpha
      listing:
        description: Also upload the store listing (texts and images)
        type: boolean
        default: true

concurrency:
  group: google-play
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Promote ${{ inputs.from }} to production
        run: fastlane android promote_production from:${{ inputs.from }}

      - name: Upload store listing
        if: inputs.listing
        run: fastlane android upload_listing
