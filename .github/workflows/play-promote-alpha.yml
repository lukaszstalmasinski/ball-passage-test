name: "Play: promote to alpha"

# Started by hand (Actions → "Play: promote to alpha" → Run workflow) after the internal build has
# been checked. Moves the current internal release to closed testing (alpha), so that the testers
# on that track get it as an update from Google Play. Google reviews it first.
on:
  workflow_dispatch:

concurrency:
  group: google-play
  cancel-in-progress: false

jobs:
  promote:
    name: Promote internal to alpha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Promote internal to alpha
        run: fastlane android promote_alpha
