name: Checks

# Every push to main and every pull request. Both jobs are required checks of main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Gradle build
        uses: ./.github/actions/setup-gradle-build

      - name: Run unit tests, screenshot tests, lint and release build
        run: ./gradlew check verifyRoborazziDebug assembleRelease bundleRelease :core:jacocoTestReport :app:createDebugUnitTestCoverageReport

      - name: Write coverage summary
        if: always()
        run: >
          python3 .github/scripts/coverage_summary.py "unit tests"
          core/build/reports/jacoco/test/jacocoTestReport.xml
          app/build/reports/coverage/test/debug/report.xml
          --min core=95 --min app=70
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-tests
          path: |
            core/build/reports/jacoco/
            app/build/reports/coverage/test/

      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-differences
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-unit-tests
          path: |
            **/build/reports/
            **/build/test-results/

  device-tests:
    name: Device tests
    # Dialog flows run on an emulator, see README.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Gradle build
        uses: ./.github/actions/setup-gradle-build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew createDebugAndroidTestCoverageReport

      - name: Write coverage summary
        if: always()
        run: >
          python3 .github/scripts/coverage_summary.py "device tests"
          app/build/reports/coverage/androidTest/debug/connected/report.xml
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-device-tests
          path: app/build/reports/coverage/androidTest/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
