name: "Pages: deploy website"

# Publishes docs/ (the website in PL, DE and EN) to GitHub Pages when it changes on main.
# Replaces GitHub's built-in "pages-build-deployment", which ran on every push to main.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages-deploy.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
