name: "Play: release to internal testing"

# A pushed version tag (e.g. v1.0.3) builds a signed App Bundle and uploads it to the internal
# testing track of Google Play, together with the changelogs for its versionCode.
# Moving it on is manual: "Play: promote to alpha", then "Play: promote to production".
#
# The job runs in the "release" environment, which holds the upload key, accepts only v* tags
# and main, and waits for approval. Google Play access uses Workload Identity Federation, so
# no Google credentials are stored here. See "Publishing to Google Play" in README.md.
on:
  push:
    tags: ['v*']

concurrency:
  group: google-play
  cancel-in-progress: false

jobs:
  release:
    name: Release to internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write   # GitHub release
      id-token: write   # Workload Identity Federation
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Gradle build
        uses: ./.github/actions/setup-gradle-build

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is not set in the release environment."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Run checks and build signed bundle
        env:
          BPT_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          BPT_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          BPT_KEY_ALIAS: ${{ vars.UPLOAD_KEY_ALIAS }}
          BPT_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew check bundleRelease

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Set up fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Upload bundle to internal testing
        run: fastlane android upload_internal

      # The bundle and the R8 mapping file are not attached: the repository is public, and the
      # mapping file would reveal the obfuscated code. Google Play keeps both.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
