name: Set up Gradle build
description: Installs JDK 21 and sets up Gradle with its build cache. Run after actions/checkout.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
